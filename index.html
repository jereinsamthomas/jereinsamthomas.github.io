<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jerein Sam Thomas | Physics & Performance Architect</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght=200;300;400;600;700&family=Fira+Code:wght=300;400;500;600&family=Exo+2:ital,wght=0,200;0,400;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --void: #02010a;
      --ion: #00ffe7;
      --plasma: #b400ff;
      --nova: #ff3cac;
      --star: #ffe066;
      --dust: #a8b8d0;
      --bright: #e8f0ff;
      --glass: rgba(255, 255, 255, 0.02);
      --gb: rgba(255, 255, 255, 0.06);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--void); color: var(--dust); font-family: 'Outfit', sans-serif; overflow-x: hidden; }
    
    /* ── INTRO OVERLAY ── */
    #intro { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity .9s var(--ease), transform 3.9s var(--ease); }
    #intro.exit { opacity: 0; transform: scale(1.05); pointer-events: none; }
    #intro-canvas { position: absolute; inset: 0; z-index: 1; }
    .intro-center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 600px; padding: 0 20px; }
    
    .ball-ring { position: relative; width: 110px; height: 110px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; }
    .ball-svg { width: 100%; height: 100%; animation: ballSpin 16s linear infinite; }
    .ball-glow { position: absolute; inset: -5px; border-radius: 50%; box-shadow: 0 0 35px rgba(0, 255, 231, 0.25); animation: pulse 2.5s ease infinite; }
    .data-stream { position: absolute; bottom: -22px; font-family: 'Fira Code', monospace; font-size: 0.58rem; color: var(--ion); letter-spacing: 1px; white-space: nowrap; text-shadow: 0 0 8px rgba(0,255,231,0.6); }
    
    .intro-title { font-family: 'Orbitron', sans-serif; font-size: clamp(1.4rem, 4vw, 2.4rem); font-weight: 900; letter-spacing: 6px; color: #fff; margin-bottom: 8px; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
    .intro-sub { font-family: 'Fira Code', monospace; font-size: 0.65rem; color: rgba(168, 184, 208, 0.6); letter-spacing: 3px; margin-bottom: 32px; text-transform: uppercase; }
    .intro-sub span { color: var(--ion); }
    
    .intro-bar-wrap { width: 280px; height: 2px; background: rgba(255, 255, 255, 0.05); position: relative; margin-bottom: 12px; overflow: hidden; }
    .intro-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--ion), var(--plasma)); box-shadow: 0 0 10px var(--ion); }
    .intro-bar-label { font-family: 'Fira Code', monospace; font-size: 0.58rem; color: rgba(168, 184, 208, 0.4); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; min-height: 15px; }
    
    .intro-status { display: flex; flex-direction: column; gap: 6px; min-height: 100px; text-align: left; width: 280px; }
    .isl { font-family: 'Fira Code', monospace; font-size: 0.58rem; letter-spacing: 1.5px; color: rgba(168, 184, 208, 0.15); transform: translateX(-8px); opacity: 0; transition: all 0.4s var(--ease); display: flex; justify-content: space-between; }
    .isl.lit { opacity: 1; transform: translateX(0); color: rgba(168, 184, 208, 0.5); }
    .isl.done { color: var(--ion); text-shadow: 0 0 8px rgba(0, 255, 231, 0.3); }
    .isl .status-val { color: var(--plasma); }
    .isl.done .status-val { color: var(--star); }
    
    .intro-skip { position: absolute; bottom: 40px; right: 40px; z-index: 3; font-family: 'Fira Code', monospace; font-size: 0.6rem; color: rgba(168, 184, 208, 0.3); background: transparent; border: 1px solid rgba(168, 184, 208, 0.15); padding: 6px 16px; letter-spacing: 2px; transition: all 0.3s; cursor: pointer; }
    .intro-skip:hover { color: var(--ion); border-color: var(--ion); background: rgba(0, 255, 231, 0.03); }

    /* ── NAV ── */
    body.intro-on { overflow: hidden; }
    body.intro-on a, body.intro-on button { cursor: none; }

    /* ── GRAIN EFFECT ── */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
      opacity: .25; pointer-events: none;
    }

    /* ── TRACKING CURSORS ── */
    #cd { width: 8px; height: 8px; background: var(--ion); border-radius: 50%; position: fixed; z-index: 9999; pointer-events: none; transform: translate(-50%, -50%); box-shadow: 0 0 10px var(--ion), 0 0 20px rgba(0,255,231,.4); transition: background .2s, box-shadow .2s, transform .1s; top: -100px; left: -100px; }
    #cr { width: 36px; height: 36px; border: 1px dashed rgba(0,243,255,.3); border-radius: 50%; position: fixed; z-index: 9998; pointer-events: none; transform: translate(-50%, -50%); transition: width .2s var(--ease), height .2s var(--ease), border-color .2s, transform .05s linear; top: -100px; left: -100px; }
    #cd.hov { background: var(--nova); box-shadow: 0 0 12px var(--nova), 0 0 24px rgba(255,60,172,.5); transform: translate(-50%, -50%) scale(1.3); }
    #cr.hov { width: 48px; height: 48px; border: 1.5px solid var(--nova); animation: spin 3s linear infinite; }
    
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg) } }
    @keyframes ballSpin { 100% { transform: rotate(360deg) } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.03); } }

    nav { position: fixed; top: 0; width: 100%; padding: 24px 6%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--gb); background: rgba(2,1,10,.6); }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 1.05rem; font-weight: 900; color: var(--ion); text-decoration: none; letter-spacing: 4px; position: relative; text-shadow: 0 0 15px rgba(0,255,231,.4); }
    .logo::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 1px; background: linear-gradient(90deg, var(--ion), transparent); animation: logoPulse 4s ease infinite; }
    @keyframes logoPulse { 0%, 100% { opacity: .3; width: 100% } 50% { opacity: 0.9; width: 60% } }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { text-decoration: none; color: rgba(168,184,208,.6); font-size: .68rem; font-family: 'Fira Code', monospace; text-transform: uppercase; letter-spacing: 1.5px; transition: .3s; position: relative; padding-bottom: 4px; }
    .nav-links a::before { content: '→ '; color: var(--plasma); opacity: 0; margin-right: 2px; transition: .2s; }
    .nav-links a:hover::before { opacity: 1; }
    .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: linear-gradient(90deg, var(--ion), var(--plasma)); transition: width .3s var(--ease); }
    .nav-links a:hover { color: var(--bright); }
    .nav-links a:hover::after { width: 100%; }

    /* ── HERO ── */
    #hero { min-height: 100vh; display: flex; align-items: center; padding: 0 10%; position: relative; overflow: hidden; z-index: 2; }
    .hero-container { position: relative; z-index: 5; margin-top: 40px; }
    .hero-name-wrap { position: relative; margin-bottom: 24px; }
    .hero-name {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: clamp(2.8rem, 8vw, 6.5rem); line-height: .9; letter-spacing: 2px;
      color: transparent; background: linear-gradient(135deg, #fff 10%, var(--ion) 45%, var(--plasma) 80%, var(--nova) 100%);
      -webkit-background-clip: text; background-clip: text; position: relative; animation: nameReveal 1.4s var(--ease) forwards;
      filter: drop-shadow(0 0 25px rgba(0,255,231,.15));
    }
    @keyframes nameReveal { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: translateY(0) } }
    .hero-sub { font-family: 'Exo 2', sans-serif; font-size: clamp(.85rem, 1.8vw, 1.2rem); font-style: italic; font-weight: 300; color: var(--ion); letter-spacing: 5px; text-transform: uppercase; margin-bottom: 8px; animation: subFade 1s var(--ease) .2s forwards; opacity: 0; text-shadow: 0 0 10px rgba(0,255,231,0.3); }
    @keyframes subFade { from { opacity: 0; transform: translateX(-15px) } to { opacity: 1; transform: translateX(0) } }
    
    .hero-terminal { border-left: 2px solid transparent; background: linear-gradient(var(--void), var(--void)) padding-box, linear-gradient(180deg, var(--ion), var(--plasma)) border-box; padding-left: 36px; position: relative; z-index: 2; max-width: 750px; }
    .system-status { font-family: 'Fira Code', monospace; color: rgba(168,184,208,0.7); font-size: .72rem; margin-bottom: 16px; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
    .sdot { width: 6px; height: 6px; background: var(--ion); border-radius: 50%; animation: blink 1.5s ease infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,231,.6) } 50% { opacity: .3; box-shadow: 0 0 0 8px rgba(0,255,231,0) } }
    .hero-desc { font-size: .95rem; line-height: 1.75; color: var(--dust); font-weight: 300; min-height: 75px; font-family: 'Outfit', sans-serif; }
    
    .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
    .htag { font-family: 'Fira Code', monospace; font-size: .6rem; padding: 4px 10px; border: 1px solid var(--gb); color: var(--plasma); letter-spacing: 1px; transition: .3s; opacity: 0; animation: tagIn .6s var(--ease) forwards; }
    @keyframes tagIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    .htag:hover { border-color: var(--ion); color: #fff; background: rgba(0,255,231,0.02); }
    
    .scue { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: 'Fira Code', monospace; font-size: .55rem; color: rgba(168,184,208,.25); letter-spacing: 2px; animation: bob 2s ease infinite; }
    @keyframes bob { 0%, 100% { transform: translateX(-50%) translateY(0) } 50% { transform: translateX(-50%) translateY(6px) } }
    .sline { width: 1px; height: 45px; background: linear-gradient(180deg, transparent, var(--ion), transparent); }

    /* ── SECTIONS ── */
    section { position: relative; z-index: 2; }
    .si { padding: 90px 10%; }
    .slabel { font-family: 'Fira Code', monospace; font-size: .65rem; letter-spacing: 3px; color: var(--plasma); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; }
    .slabel::after { content: ''; flex: 1; max-width: 50px; height: 1px; background: var(--plasma); }
    .stitle { font-family: 'Orbitron', sans-serif; font-size: clamp(1.6rem, 3.5vw, 2.6rem); color: var(--bright); letter-spacing: 2px; margin-bottom: 48px; line-height: 1.1; font-weight: 700; }

    /* ── ACADEMIC MATRIX ── */
    .edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    @media(max-width:960px){ .edu-grid { grid-template-columns: 1fr; } }
    .edu-card { background: rgba(5,6,9,0.4); border: 1px solid var(--gb); padding: 36px; position: relative; overflow: hidden; transition: border-color .4s; }
    .edu-card::before { content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 0%; background: linear-gradient(180deg, var(--ion), var(--plasma)); transition: height .6s var(--ease); }
    .edu-card:hover::before { height: 100%; }
    .edu-card:hover { border-color: rgba(0,255,231,0.2); }
    
    .edu-badge { display: inline-flex; align-items: center; gap: 6px; font-family: 'Fira Code', monospace; font-size: .6rem; letter-spacing: 2px; color: var(--plasma); margin-bottom: 14px; text-transform: uppercase; }
    .edu-badge::before { content: '//'; color: var(--ion); }
    .edu-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.25rem; letter-spacing: 1px; color: var(--bright); margin-bottom: 6px; font-weight: 700; }
    .edu-inst { font-size: .85rem; color: rgba(168,184,208,0.6); margin-bottom: 6px; }
    .edu-year { font-family: 'Fira Code', monospace; font-size: .65rem; color: var(--ion); margin-bottom: 18px; letter-spacing: 1px; }
    
    .highlight-line { background: rgba(0,255,231,.02); border-left: 2px solid var(--ion); padding: 12px 16px; font-size: .82rem; color: rgba(168,184,208,.85); margin-bottom: 20px; font-style: italic; line-height: 1.5; }
    .sub-headers { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; color: var(--bright); letter-spacing: 2px; text-transform: uppercase; margin: 18px 0 10px 0; display: flex; align-items: center; gap: 8px; }
    .sub-headers::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.05); }

    .tag { display: inline-block; padding: 3px 10px; border: 1px solid rgba(180,0,255,.25); font-size: .58rem; font-family: 'Fira Code', monospace; color: var(--plasma); margin: 0 4px 6px 0; text-transform: uppercase; transition: 0.2s; }
    .tag.c { border-color: rgba(0,255,231,.25); color: var(--ion); }
    .tag:hover { background: rgba(255,255,255,0.03); color: #fff; }

    /* ── DOMAIN SEGREGATION MODULES ── */
    .domain-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 24px; }
    @media(max-width:960px){ .domain-container { grid-template-columns: 1fr; } }
    .domain-card { background: rgba(4,5,8,0.6); border: 1px solid var(--gb); padding: 32px; position: relative; overflow: hidden; transition: 0.4s var(--ease); }
    .domain-card:hover { transform: translateY(-6px); border-color: rgba(180,0,255,0.25); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .domain-icon { font-size: 2.2rem; color: var(--ion); margin-bottom: 20px; display: block; filter: drop-shadow(0 0 10px rgba(0,255,231,0.2)); }
    .domain-card.physics :hover .domain-icon { color: var(--ion); }
    .domain-card.ds .domain-icon { color: var(--plasma); filter: drop-shadow(0 0 10px rgba(180,0,255,0.2)); }
    .domain-card.football .domain-icon { color: var(--nova); filter: drop-shadow(0 0 10px rgba(255,60,172,0.2)); }
    .domain-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.15rem; color: var(--bright); margin-bottom: 12px; letter-spacing: 1px; }
    .domain-card p { font-size: 0.85rem; line-height: 1.6; color: var(--dust); margin-bottom: 18px; font-weight: 300; }
    .domain-list { list-style: none; font-family: 'Fira Code', monospace; font-size: 0.68rem; color: rgba(168,184,208,0.7); }
    .domain-list li { margin-bottom: 8px; display: flex; align-items: flex-start; gap: 6px; }
    .domain-list li::before { content: '▪'; color: var(--ion); }
    .domain-card.ds .domain-list li::before { content: '▪'; color: var(--plasma); }
    .domain-card.football .domain-list li::before { content: '▪'; color: var(--nova); }

    /* ── CAPABILITIES SKILLS ── */
    .skrow { margin-bottom: 18px; }
    .skhead { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .sknm { font-family: 'Fira Code', monospace; font-size: .65rem; letter-spacing: 1px; color: rgba(168,184,208,0.8); }
    .skpct { font-family: 'Fira Code', monospace; font-size: .65rem; color: var(--ion); }
    .sktrack { height: 2px; background: rgba(255,255,255,.05); position: relative; overflow: hidden; }
    .skfill { position: absolute; top: 0; left: 0; height: 100%; background: linear-gradient(90deg, var(--ion), var(--plasma)); width: 0%; transition: width 1.5s var(--ease); box-shadow: 0 0 8px var(--ion); }

    /* ── ANALYTICAL PIPELINES / PORTFOLIO IMAGE STYLING ── */
    .index-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .index-card { background: rgba(5,6,9,0.5); border: 1px solid var(--gb); overflow: hidden; transition: .5s var(--ease); text-decoration: none; color: inherit; position: relative; display: block; }
    .index-card:hover { border-color: rgba(0,255,231,.25); transform: translateY(-8px); box-shadow: 0 30px 60px rgba(0,0,0,.8); }
    
    .cimg { 
      width: 100%; 
      height: 180px; 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      position: relative; 
      border-bottom: 1px solid var(--gb); 
      transition: .5s var(--ease);
    }
    .cimg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 1, 10, 0.4) 0%, rgba(255, 60, 172, 0.15) 50%, rgba(0, 255, 231, 0.25) 100%);
      mix-blend-mode: multiply;
      transition: opacity 0.5s var(--ease);
      z-index: 1;
    }
    .cimg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(2, 1, 10, 0.55);
      transition: background 0.5s var(--ease);
      z-index: 1;
    }
    .index-card:hover .cimg::after {
      background: rgba(2, 1, 10, 0.2);
    }
    .cimg i { 
      font-size: 2.6rem; 
      color: rgba(0, 255, 231, 0.4); 
      position: relative;
      z-index: 2;
      transition: .5s var(--ease); 
      text-shadow: 0 4px 10px rgba(0,0,0,0.9);
    }
    .index-card:hover .cimg i { 
      color: var(--ion); 
      transform: scale(1.08); 
      filter: drop-shadow(0 0 15px rgba(0,255,231,0.6)); 
    }

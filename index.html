<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jerein Sam Thomas | Data Scientist & Performance Architect</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@200;300;400;600;700&family=Fira+Code:wght@300;400;500;600&family=Exo+2:ital,wght=0,200;0,400;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --void: #02010a;
      --ion: #00ffe7;
      --plasma: #b400ff;
      --nova: #ff3cac;
      --star: #ffe066;
      --dust: #a8b8d0;
      --bright: #e8f0ff;
      --glass: rgba(255, 255, 255, 0.025);
      --gb: rgba(255, 255, 255, 0.06);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--void); color: var(--dust); font-family: 'Outfit', sans-serif; overflow-x: hidden; }

    body.intro-on {
      overflow: hidden;
    }
    body.intro-on, body.intro-on a, body.intro-on button {
      cursor: none;
    }

    /* ── GRAIN ── */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
      opacity: .28; pointer-events: none;
    }

    /* ── CUSTOM CURSOR ── */
    #cd { width: 10px; height: 10px; background: var(--ion); border-radius: 50%; position: fixed; z-index: 9999; pointer-events: none; transform: translate(-50%, -50%); box-shadow: 0 0 10px var(--ion), 0 0 22px rgba(0,255,231,.35); transition: background .25s, box-shadow .25s, transform .1s; }
    #cr { width: 40px; height: 40px; border: 1px dashed rgba(0,243,255,.35); border-radius: 50%; position: fixed; z-index: 9998; pointer-events: none; transform: translate(-50%, -50%); transition: width .25s var(--ease), height .25s var(--ease), border-color .25s, transform .08s linear; }
    #cd.hov { background: var(--nova); box-shadow: 0 0 14px var(--nova), 0 0 28px rgba(255,60,172,.45); transform: translate(-50%, -50%) scale(1.4); }
    #cr.hov { width: 52px; height: 52px; border: 1.5px solid var(--nova); animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg) } }

    /* ── INTRO OVERLAY ── */
    #intro { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
    #intro.exit { opacity: 0; transform: scale(1.05); pointer-events: none; }
    #intro-canvas { position: absolute; inset: 0; z-index: 1; }
    .intro-center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 600px; padding: 0 20px; }
    
    .ball-ring { position: relative; width: 100px; height: 100px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; }
    .ball-svg { width: 100%; height: 100%; animation: spin 12s linear infinite; }
    .ball-glow { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 30px rgba(0, 255, 231, 0.2); animation: pulse 3s ease infinite; }
    .data-stream { position: absolute; bottom: -18px; font-family: 'Fira Code', monospace; font-size: 0.55rem; color: var(--ion); letter-spacing: 2px; }
    
    .intro-title { font-family: 'Orbitron', sans-serif; font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 900; letter-spacing: 6px; color: #fff; margin-bottom: 8px; opacity: 0; transform: translateY(15px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }
    .intro-title.show { opacity: 1; transform: translateY(0); }
    .intro-sub { font-family: 'Fira Code', monospace; font-size: 0.65rem; color: rgba(168, 184, 208, 0.5); letter-spacing: 4px; margin-bottom: 32px; opacity: 0; transition: opacity 0.8s ease 0.3s; }
    .intro-sub.show { opacity: 1; }
    
    .intro-bar-wrap { width: 260px; height: 2px; background: rgba(255, 255, 255, 0.05); position: relative; margin-bottom: 12px; overflow: hidden; }
    .intro-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--ion), var(--plasma)); box-shadow: 0 0 10px var(--ion); }
    .intro-bar-label { font-family: 'Fira Code', monospace; font-size: 0.58rem; color: rgba(168, 184, 208, 0.4); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; }
    
    .intro-status { display: flex; flex-direction: column; gap: 6px; min-height: 90px; }
    .isl { font-family: 'Fira Code', monospace; font-size: 0.58rem; letter-spacing: 2px; color: rgba(168, 184, 208, 0.2); transform: translateX(-10px); opacity: 0; transition: all 0.4s var(--ease); }
    .isl.lit { opacity: 1; transform: translateX(0); color: rgba(168, 184, 208, 0.6); }
    .isl.done { color: var(--ion); text-shadow: 0 0 8px rgba(0, 255, 231, 0.3); }
    
    .intro-skip { position: absolute; bottom: 40px; right: 40px; z-index: 3; font-family: 'Fira Code', monospace; font-size: 0.6rem; color: rgba(168, 184, 208, 0.3); background: transparent; border: 1px solid rgba(168, 184, 208, 0.15); padding: 6px 16px; letter-spacing: 2px; transition: all 0.3s; }
    .intro-skip:hover { color: var(--ion); border-color: var(--ion); background: rgba(0, 255, 231, 0.03); }

    /* ── NAV ── */
    nav { position: fixed; top: 0; width: 100%; padding: 26px 8%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px); border-bottom: 1px solid var(--gb); background: rgba(2,1,10,.5); }
    .logo { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: var(--ion); text-decoration: none; letter-spacing: 5px; position: relative; text-shadow: 0 0 20px rgba(0,255,231,.5); }
    .logo::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background: linear-gradient(90deg, var(--ion), transparent); animation: logoPulse 3s ease infinite; }
    @keyframes logoPulse { 0%, 100% { opacity: .4; width: 100% } 50% { opacity: 1; width: 70% } }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { text-decoration: none; color: rgba(168,184,208,.5); font-size: .7rem; font-family: 'Fira Code', monospace; text-transform: uppercase; letter-spacing: 2px; transition: .4s; position: relative; padding-bottom: 4px; }
    .nav-links a::before { content: './'; color: var(--plasma); opacity: 0; transition: .3s; font-size: .65rem; }
    .nav-links a:hover::before { opacity: 1; }
    .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: linear-gradient(90deg, var(--ion), var(--plasma)); transition: width .4s var(--ease); }
    .nav-links a:hover { color: var(--bright); }
    .nav-links a:hover::after { width: 100%; }

    /* ── HERO ── */
    #hero { min-height: 100vh; display: flex; align-items: center; padding: 0 10%; position: relative; overflow: hidden; z-index: 2; }
    .hero-name-wrap { position: relative; margin-bottom: 30px; }
    .hero-name {
      font-family: 'Orbitron', sans-serif; font-weight: 900;
      font-size: clamp(3.5rem, 10vw, 7.8rem); line-height: .88; letter-spacing: 4px;
      color: transparent; background: linear-gradient(135deg, #fff 0%, var(--ion) 40%, var(--plasma) 75%, var(--nova) 100%);
      -webkit-background-clip: text; background-clip: text; position: relative; animation: nameReveal 1.6s var(--ease) forwards; opacity: 0;
      filter: drop-shadow(0 0 30px rgba(0,255,231,.25));
    }
    @keyframes nameReveal { from { opacity: 0; transform: translateY(40px) skewX(-3deg) } to { opacity: 1; transform: translateY(0) skewX(0) } }
    .hero-sub { font-family: 'Exo 2', sans-serif; font-size: clamp(.9rem, 2vw, 1.3rem); font-style: italic; font-weight: 200; color: rgba(168,184,208,.7); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 10px; animation: subFade 1s var(--ease) .3s forwards; opacity: 0; }
    @keyframes subFade { from { opacity: 0; transform: translateX(-20px) } to { opacity: .7; transform: translateX(0) } }
    .hero-terminal { border-left: 2px solid transparent; background: linear-gradient(var(--void), var(--void)) padding-box, linear-gradient(180deg, var(--ion), var(--plasma)) border-box; padding-left: 48px; position: relative; z-index: 2; }
    .system-status { font-family: 'Fira Code', monospace; color: var(--ion); font-size: .78rem; margin-bottom: 22px; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; animation: subFade 1s var(--ease) .1s forwards; opacity: 0; }
    .sdot { width: 7px; height: 7px; background: var(--ion); border-radius: 50%; animation: blink 1.5s ease infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,231,.5) } 50% { opacity: .4; box-shadow: 0 0 0 9px rgba(0,255,231,0) } }
    .hero-desc { max-width: 560px; font-size: 1rem; line-height: 1.82; color: var(--dust); font-weight: 300; animation: subFade 1s var(--ease) 1.8s forwards; opacity: 0; }
    .hero-desc strong { color: var(--ion); font-weight: 600; }
    .hero-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
    .htag { font-family: 'Fira Code', monospace; font-size: .63rem; padding: 5px 13px; border: 1px solid var(--gb); color: var(--plasma); letter-spacing: 1.5px; position: relative; overflow: hidden; transition: .4s; opacity: 0; animation: tagIn .7s var(--ease) forwards; animation-delay: calc(var(--i, 0) * .1s + 2s); }
    @keyframes tagIn { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    .htag:hover { border-color: var(--plasma); color: #fff; }
    .scue { position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; font-family: 'Fira Code', monospace; font-size: .58rem; color: rgba(168,184,208,.22); letter-spacing: 3px; animation: bob 2.2s ease infinite; }
    @keyframes bob { 0%, 100% { transform: translateX(-50%) translateY(0) } 50% { transform: translateX(-50%) translateY(9px) } }
    .sline { width: 1px; height: 54px; background: linear-gradient(180deg, transparent, var(--ion), transparent); }

    /* ── SECTIONS ── */
    section { position: relative; z-index: 2; }
    .si { padding: 110px 10%; }
    .slabel { font-family: 'Fira Code', monospace; font-size: .68rem; letter-spacing: 4px; color: var(--plasma); margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
    .slabel::after { content: ''; flex: 1; max-width: 60px; height: 1px; background: var(--plasma); }
    .stitle { font-family: 'Orbitron', sans-serif; font-size: clamp(1.8rem, 4vw, 3rem); color: var(--bright); letter-spacing: 3px; margin-bottom: 54px; line-height: 1; font-weight: 700; }

    /* ── CARDS ── */
    .index-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
    .index-card { background: var(--glass); border: 1px solid var(--gb); overflow: hidden; transition: .8s var(--ease); text-decoration: none; color: inherit; position: relative; display: block; }
    .index-card::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(135deg, rgba(0,255,231,.05), rgba(180,0,255,.05)); opacity: 0; transition: opacity .5s; }
    .index-card:hover::before { opacity: 1; }
    .index-card:hover { border-color: rgba(0,255,231,.3); transform: translateY(-14px); box-shadow: 0 40px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(0,255,231,.1), inset 0 0 40px rgba(0,255,231,.02); }
    .cimg { width: 100%; height: 240px; object-fit: cover; display: block; filter: grayscale(.75) brightness(.55) saturate(.8); transition: .7s var(--ease); }
    .index-card:hover .cimg { filter: grayscale(0) brightness(.9) saturate(1.3); }
    .cbody { padding: 26px 28px 30px; background: #050609; position: relative; }
    .cid { font-family: 'Fira Code', monospace; color: var(--ion); font-size: .6rem; margin-bottom: 9px; display: block; letter-spacing: 2px; }
    .ctitle { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--bright); letter-spacing: 2px; font-weight: 700; }
    .cdesc { font-size: .8rem; color: var(--dust); margin-top: 10px; line-height: 1.6; font-weight: 300; }
    .carrow { position: absolute; right: 26px; bottom: 26px; color: var(--ion); opacity: 0; transform: translateX(-8px); transition: .4s var(--ease); }
    .index-card:hover .carrow { opacity: 1; transform: translateX(0); }
    .card-bar { position: absolute; bottom: 0; left: 0; width: 0%; height: 2px; background: linear-gradient(90deg, var(--ion), var(--plasma)); transition: width .5s var(--ease); }
    .index-card:hover .card-bar { width: 100%; }

    /* ── STATS ── */
    .stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--gb); border: 1px solid var(--gb); margin-top: 56px; }
    .sstat { background: var(--void); padding: 34px 28px; text-align: center; transition: .4s; position: relative; overflow: hidden; }
    .snum { font-family: 'Orbitron', sans-serif; font-size: 2.6rem; color: var(--ion); line-height: 1; display: block; text-shadow: 0 0 30px rgba(0,255,231,.35); font-weight: 900; }
    .slb { font-family: 'Fira Code', monospace; font-size: .58rem; letter-spacing: 2px; color: rgba(168,184,208,.38); margin-top: 7px; display: block; }

    /* ── ACADEMIC ── */
    .edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    @media(max-width:900px){ .edu-grid { grid-template-columns: 1fr; } }
    .edu-card { background: var(--glass); border: 1px solid var(--gb); padding: 42px; position: relative; overflow: hidden; transition: .5s; }
    .edu-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 0%; background: linear-gradient(180deg, var(--ion), var(--plasma)); transition: height .8s var(--ease); }
    .edu-card:hover::before { height: 100%; }
    .edu-badge { display: inline-flex; align-items: center; gap: 8px; font-family: 'Fira Code', monospace; font-size: .62rem; letter-spacing: 3px; color: var(--plasma); margin-bottom: 18px; }
    .edu-badge::before { content: '//'; color: var(--ion); }
    .edu-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; letter-spacing: 2px; color: var(--bright); margin-bottom: 14px; font-weight: 700; }
    .edu-year { font-family: 'Fira Code', monospace; font-size: .65rem; color: var(--ion); margin-bottom: 16px; letter-spacing: 2px; }
    .edu-card p { color: var(--dust); font-size: .88rem; line-height: 1.8; font-weight: 300; margin-bottom: 22px; }
    .highlight-line { background: rgba(0,255,231,.04); border-left: 2px solid var(--ion); padding: 10px 16px; font-size: .82rem; color: rgba(168,184,208,.8); margin-bottom: 18px; font-style: italic; }
    .tag { display: inline-block; padding: 4px 12px; border: 1px solid rgba(180,0,255,.3); font-size: .62rem; font-family: 'Fira Code', monospace; color: var(--plasma); margin: 0 6px 8px 0; }
    .tag.c { border-color: rgba(0,255,231,.3); color: var(--ion); }
    .module-list { list-style: none; margin-top: 20px; }
    .module-list li { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.04); font-size: .82rem; color: var(--dust); font-weight: 300; display: flex; justify-content: space-between; align-items: center; transition: .3s; }
    .module-list li:hover { background: rgba(0,255,231,.03); padding-left: 22px; }
    .module-list li span { font-family: 'Fira Code', monospace; font-size: .6rem; color: var(--ion); }

    /* ── SKILLS ── */
    .skills { margin-top: 30px; }
    .skrow { margin-bottom: 16px; }
    .skhead { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .sknm { font-family: 'Fira Code', monospace; font-size: .66rem; letter-spacing: 1.5px; color: var(--dust); }
    .skpct { font-family: 'Fira Code', monospace; font-size: .66rem; color: var(--ion); }
    .sktrack { height: 2px; background: rgba(255,255,255,.05); position: relative; overflow: hidden; }
    .skfill { position: absolute; top: 0; left: 0; height: 100%; background: linear-gradient(90deg, var(--ion), var(--plasma)); width: 0%; transition: width 1.3s var(--ease); box-shadow: 0 0 8px var(--ion); }
    .skfill.go { width: var(--w); }

    /* ── TACTICS ── */
    #tactics { background: linear-gradient(180deg, transparent, rgba(13,0,37,.3), transparent); }
    .tactics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; }
    .pitch-wrap { position: relative; }
    .pitch-wrap::before { content: 'FAS-v1 // LIVE'; position: absolute; top: 14px; left: 14px; z-index: 5; font-family: 'Fira Code', monospace; font-size: .58rem; color: var(--ion); letter-spacing: 3px; opacity: .65; }
    #pitch-canvas { width: 100%; height: 480px; background: #000; border-radius: 5px; box-shadow: inset 0 0 60px rgba(0,255,231,.04), 0 0 50px rgba(0,0,0,.7); }
    .td h3 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; letter-spacing: 2px; color: var(--bright); margin-bottom: 14px; line-height: 1; font-weight: 700; }
    .td>p { color: var(--dust); font-size: .9rem; line-height: 1.82; margin-bottom: 32px; font-weight: 300; }
    .tlist { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .tlist li { padding: 16px 18px; border: 1px solid var(--gb); color: var(--dust); font-size: .85rem; line-height: 1.6; transition: .4s; position: relative; overflow: hidden; }
    .tlist li:hover { border-color: rgba(0,255,231,.15); background: rgba(0,255,231,.02); padding-left: 26px; }
    .tlist li strong { color: var(--ion); font-weight: 600; }

    /* ── CONTACT ── */
    .quote-block { border-left: 3px solid var(--plasma); padding: 28px 38px; background: var(--glass); margin-bottom: 52px; position: relative; overflow: hidden; }
    .quote-block p { font-size: 1.3rem; line-height: 1.65; max-width: 800px; font-weight: 300; color: var(--bright); }
    .gw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    @media(max-width:780px){ .gw-grid { grid-template-columns: 1fr; } }
    .gw { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px 20px; border: 1px solid var(--gb); background: var(--glass); text-decoration: none; position: relative; overflow: hidden; transition: .5s var(--ease); min-height: 160px; }
    .gw:hover { border-color: rgba(0,255,231,.25); transform: translateY(-8px); box-shadow: 0 24px 60px rgba(0,0,0,.7); }
    .gw-icon { font-size: 2rem; transition: .4s; }
    .gw-label { font-family: 'Fira Code', monospace; font-size: .65rem; letter-spacing: 3px; color: var(--dust); text-transform: uppercase; text-align: center; }
    .gw-handle { font-family: 'Outfit', sans-serif; font-size: .85rem; color: var(--ion); font-weight: 600; text-align: center; }
    .gw-action { font-family: 'Fira Code', monospace; font-size: .58rem; letter-spacing: 2px; color: rgba(168,184,208,.35); text-transform: uppercase; opacity: 0; transition: .3s; }
    .gw:hover .gw-action { opacity: 1; color: var(--ion); }
    .gw.gmail .gw-icon { color: #ea4335; }
    .gw.linkedin .gw-icon { color: #0077b5; }
    .gw.instagram .gw-icon { color: var(--nova); }

    /* ── FOOTER ── */
    footer { text-align: center; padding: 70px 10% 36px; font-size: .6rem; color: rgba(255,255,255,.1); font-family: 'Fira Code', monospace; letter-spacing: 3px; position: relative; z-index: 2; border-top: 1px solid var(--gb); }
    .fglow { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--ion), var(--plasma), transparent); margin-bottom: 36px; opacity: .25; }

    /* ── REVEAL ── */
    .reveal { opacity: 0; transform: translateY(48px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
    .reveal.active { opacity: 1; transform: translateY(0); }

    /* ── FLOATING ORBS ── */
    .orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 1; filter: blur(80px); opacity: .12; animation: orbDrift 20s ease infinite; }
    .orb1 { width: 400px; height: 400px; background: var(--plasma); top: 10%; left: -10%; }
    .orb2 { width: 300px; height: 300px; background: var(--ion); bottom: 15%; right: -5%; }
    @keyframes orbDrift { 0%, 100% { transform: translate(0,0) scale(1) } 50% { transform: translate(30px,-40px) scale(1.1) } }

    #galaxy { position: fixed; inset: 0; z-index: 0; }
  </style>
</head>
<body class="intro-on">

  <div id="cd"></div>
  <div id="cr"></div>

  <div id="intro">
    <canvas id="intro-canvas"></canvas>
    <div class="intro-center">
      <div class="ball-ring">
        <div class="ball-glow"></div>
        <svg class="ball-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="ballbg" cx="38%" cy="32%">
              <stop offset="0%" stop-color="#1a1a2e"/>
              <stop offset="100%" stop-color="#050510"/>
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="46" fill="url(#ballbg)" stroke="rgba(0,255,231,.4)" stroke-width="1"/>
          <polygon points="50,18 59,28 55,41 45,41 41,28" fill="none" stroke="rgba(0,255,231,.6)" stroke-width=".9"/>
          <polygon points="69,37 77,47 71,57 60,53 59,41" fill="none" stroke="rgba(180,0,255,.55)" stroke-width=".9"/>
          <polygon points="31,37 41,41 40,53 29,57 23,47" fill="none" stroke="rgba(180,0,255,.55)" stroke-width=".9"/>
          <polygon points="38,69 46,61 54,61 62,69 56,79" fill="none" stroke="rgba(0,255,231,.6)" stroke-width=".9"/>
          <circle cx="50" cy="50" r="3.5" fill="var(--ion)" opacity=".7"/>
        </svg>

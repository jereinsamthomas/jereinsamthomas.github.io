<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harborlux — Claim Your Summit</title>
  <meta name="description" content="Harborlux: harbour-view penthouses above a city that never sleeps. Claim your summit.">

  <!-- Preload Inter Variable Font -->
  <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: 'Inter';
      src: url('https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0D0A22;
      --ink: #180F3C;
      --btn: #F2B8C0;
      --btn-hover: #F7C9D0;
      --text: #FFFFFF;
      --link-inactive: rgba(255, 255, 255, 0.88);
      --link-hover-bg: rgba(255, 255, 255, 0.14);
      --nav-glass-bg: rgba(255, 255, 255, 0.14);
      --nav-glass-ring: rgba(255, 255, 255, 0.12);
      --u: 1px;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Full-viewport Hero Container */
    .hero {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
      background-color: var(--bg);
    }

    /* 16:9 Stage Container */
    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1600px;
      height: 900px;
      pointer-events: none;
    }

    .stage-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .stage-layer img,
    .stage-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 1. Back Layer */
    .layer-back {
      z-index: 1;
      transform-origin: 50% 40%;
      will-change: transform;
    }

    .layer-back .top-shade {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(180deg, rgba(13, 8, 40, 0.45) 0%, transparent 100%);
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      will-change: opacity;
    }

    .rain-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.7s linear;
      z-index: 2;
      pointer-events: none;
    }

    /* 2. Headline Block */
    .headline-block {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      width: 100vw;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      will-change: transform;
    }

    .kicker {
      position: absolute;
      font-weight: 300;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      line-height: 1;
      left: 50%;
      white-space: nowrap;
      will-change: opacity, transform;
    }

    .giant-word {
      display: inline-block;
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    .giant-word .letter {
      display: inline-block;
      will-change: opacity, transform;
    }

    /* 3. Mid Layer */
    .layer-mid {
      z-index: 3;
      transform-origin: 50% 45%;
      will-change: transform;
    }

    /* 4. Front Layer */
    .layer-front {
      z-index: 4;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .glass-tint {
      position: absolute;
      left: 5.2%;
      right: 4.1%;
      top: 57.9%;
      height: 25.4%;
      background: linear-gradient(180deg, rgba(190, 200, 255, 0.10) 0%, rgba(150, 160, 230, 0.05) 60%, rgba(120, 130, 210, 0.08) 100%);
      backdrop-filter: blur(1.2px) saturate(1.05);
      -webkit-backdrop-filter: blur(1.2px) saturate(1.05);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: none;
      z-index: 1;
    }

    .front-img {
      position: relative;
      z-index: 2;
    }

    /* 5. Opening Box */
    .opening-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
      will-change: opacity;
    }

    .aerial-img, .tilt-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tilt-video {
      opacity: 0;
      will-change: opacity;
    }

    /* 6. Doors Box */
    .doors-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 7;
      pointer-events: none;
      overflow: hidden;
    }

    .door-panel {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      background-image: url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063048_97fd9a70-adbe-46bd-bfce-ec1004f6c7d8.png&w=2000&q=85');
      background-size: 200% 100%;
      will-change: transform;
    }

    .door-left {
      left: 0;
      background-position: 0 50%;
    }

    .door-right {
      right: 0;
      background-position: 100% 50%;
    }

    /* Initial state before intro clock starts */
    .intro .nav {
      opacity: 0;
      transform: translateY(-6px);
    }

    .intro .kicker {
      opacity: 0;
      transform: translate(0, 0.5em);
    }

    .intro .giant-word .letter {
      opacity: 0;
      transform: translateY(0.14em);
    }

    .intro .layer-front {
      transform: translateY(66%);
    }

    /* 7. Nav (Pinned to viewport) */
    .nav {
      position: absolute;
      top: calc(52 * var(--u));
      left: 0;
      width: 100vw;
      height: calc(48 * var(--u));
      padding: 0 calc(125 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      pointer-events: auto;
      font-size: calc(15 * var(--u));
      will-change: opacity, transform;
    }

    /* Left: Wordmark */
    .nav-left {
      display: flex;
      align-items: center;
    }

    .wordmark {
      font-weight: 600;
      font-size: calc(17 * var(--u));
      letter-spacing: 0.28em;
      color: #FFFFFF;
      text-decoration: none;
      white-space: nowrap;
    }

    /* Centre: Pill Bar */
    .pill-bar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      height: calc(48 * var(--u));
      display: flex;
      align-items: center;
      padding: calc(5 * var(--u));
      gap: calc(6 * var(--u));
      border-radius: 9999px;
      background: var(--nav-glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 0 0 1px var(--nav-glass-ring);
      white-space: nowrap;
    }

    .pill-link {
      height: calc(38 * var(--u));
      padding: 0 calc(22 * var(--u));
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 400;
      color: var(--link-inactive);
      text-decoration: none;
      transition: background-color 0.25s ease, color 0.25s ease;
      white-space: nowrap;
    }

    .pill-link:hover {
      background-color: var(--link-hover-bg);
      color: #FFFFFF;
    }

    .pill-link.active {
      background-color: #FFFFFF;
      color: var(--ink);
      font-weight: 600;
    }

    /* Right: Language + Enquire Button */
    .nav-right {
      display: flex;
      align-items: center;
      gap: calc(30 * var(--u));
      white-space: nowrap;
    }

    .lang-group {
      display: flex;
      align-items: center;
      gap: calc(9 * var(--u));
      color: rgba(255, 255, 255, 0.90);
      cursor: pointer;
    }

    .globe-icon {
      width: calc(20 * var(--u));
      height: calc(20 * var(--u));
      display: block;
    }

    .btn-enquire {
      height: calc(44 * var(--u));
      padding: 0 calc(27 * var(--u));
      border-radius: 9999px;
      background-color: var(--btn);
      color: var(--ink);
      font-weight: 600;
      font-size: inherit;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-enquire:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    /* =========================================================================
       Responsive Rules
       ========================================================================= */

    /* Below 820px wide */
    @media (max-width: 819px) {
      :root {
        --u: 1px;
      }

      .nav {
        top: 16px;
        padding: 0 18px;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .nav-row-1 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .wordmark {
        font-size: 14px;
        letter-spacing: 0.22em;
      }

      .nav-right {
        gap: 16px;
      }

      .lang-group {
        font-size: 13px;
        gap: 6px;
      }

      .globe-icon {
        width: 16px;
        height: 16px;
      }

      .btn-enquire {
        height: 36px;
        padding: 0 16px;
        font-size: 13px;
      }

      .pill-bar {
        position: relative;
        left: 0;
        transform: none;
        width: 100%;
        height: 40px;
        padding: 4px;
        gap: 4px;
        justify-content: space-between;
      }

      .pill-link {
        flex: 1 1 0;
        height: 32px;
        padding: 0 10px;
        font-size: 12px;
        text-align: center;
      }
    }

    /* At 360px and narrower */
    @media (max-width: 360px) {
      .pill-link {
        font-size: 11px;
        padding: 0 6px;
      }
    }

    /* Short landscape screens (height <= 500px) */
    @media (max-height: 500px) and (orientation: landscape) {
      .nav {
        top: 12px;
        height: 34px;
        padding: 0 24px;
        flex-direction: row;
        gap: 0;
      }

      .nav-row-1 {
        display: contents;
      }

      .wordmark {
        font-size: 13px;
      }

      .nav-right {
        gap: 16px;
      }

      .lang-group {
        font-size: 12px;
      }

      .btn-enquire {
        height: 32px;
        padding: 0 16px;
        font-size: 12px;
      }

      .pill-bar {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        height: 34px;
        padding: 3px;
        gap: 4px;
      }

      .pill-link {
        flex: initial;
        height: 28px;
        padding: 0 14px;
        font-size: 12px;
      }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .doors-box, .opening-box {
        display: none !important;
      }
      .nav, .kicker, .giant-word .letter, .layer-front, .layer-mid, .layer-back, .headline-block, .top-shade {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
        animation: none !important;
      }
      .rain-video {
        display: none !important;
      }
    }
  </style>
</head>
<body class="intro">

  <main class="hero" id="hero" aria-label="Harborlux Hero Stage">

    <!-- Nav pinned to viewport -->
    <header class="nav" id="mainNav">
      <div class="nav-row-1">
        <div class="nav-left">
          <a href="/" class="wordmark" aria-label="Harborlux Home">HARBORLUX</a>

              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <ellipse cx="12" cy="12" rx="4.5" ry="10"></ellipse>
            </svg>
            <span>Eng</span>

          <a href="#enquire" class="btn-enquire">Enquire</a>

      <!-- Centre Pill Bar -->
      <nav class="pill-bar" aria-label="Main menu">
        <a href="#home" class="pill-link active">Home</a>
        <a href="#firm" class="pill-link">The Firm</a>
        <a href="#skyline" class="pill-link">Skyline Homes</a>
        <a href="#talk" class="pill-link">Talk To Us</a>

    </header>

    <!-- Stage (16:9 Cover Box) -->
    <div class="stage" id="stage">

      <!-- 1. Back Layer -->

          src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063251_24fbd7cc-00df-49ec-8fbf-d8a0349b1e98.png&w=2000&q=85"

        <video

        ></video>
        <video
          id="rainVideoB"

      <!-- 3. Mid Layer -->
      <div class="stage-layer layer-mid" id="layerMid">
        <img
          src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063252_b9f2fecf-9be0-485f-842f-3aa6bbc251f2.png&w=2000&q=85"
          alt="Neon city skyline with illuminated harbour water"

        >
      </div>

      <!-- 4. Front Layer -->
      <div class="stage-layer layer-front" id="layerFront">
        <div class="glass-tint" id="glassTint"></div>
        <img
          src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063151_7804d758-a2eb-4499-9b56-8f493edbb206.png&w=2000&q=85"
          alt="Man in dark coat standing at penthouse glass balcony overlooking skyline"
          class="front-img"
          id="imgFront"

          height="1520"
        >
      </div>

    </div><!-- /.stage -->

    <!-- 5. Opening Box (Aerial Still + Tilt Video) -->
    <div class="opening-box" id="openingBox">
      <img
        src="https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063055_ee1debcd-d200-484f-b94f-fad6dcffd4eb.png&w=2000&q=85"
        alt="Top-down drone shot of skyscraper rooftop pool at night"
        class="aerial-img"
        id="imgAerial"
        width="2688"
        height="1520"
      >
      <video
        id="tiltVideo"
        class="tilt-video"
        playsinline
        muted
        preload="auto"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261117_063355_a600befc-45d6-4a32-9db6-9d6565a89609.mp4"
      ></video>
    </div>

    <!-- 6. Doors Box -->
    <div class="doors-box" id="doorsBox">
      <div class="door-panel door-left" id="doorLeft"></div>
      <div class="door-panel door-right" id="doorRight"></div>
    </div>

  </main>

  <script>
    (function () {
      'use strict';

      // Check reduced motion
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) {
        document.body.classList.remove('intro');
        const dBox = document.getElementById('doorsBox');
        const oBox = document.getElementById('openingBox');
        if (dBox) dBox.style.display = 'none';
        if (oBox) oBox.style.display = 'none';
        initStageLayout();
        window.addEventListener('resize', initStageLayout);
        return;
      }

      // Elements
      const stage = document.getElementById('stage');
      const doorLeft = document.getElementById('doorLeft');
      const doorRight = document.getElementById('doorRight');
      const openingBox = document.getElementById('openingBox');
      const doorsBox = document.getElementById('doorsBox');
      const tiltVideo = document.getElementById('tiltVideo');
      const nav = document.getElementById('mainNav');
      const kicker = document.getElementById('kicker');
      const letters = document.querySelectorAll('.giant-word .letter');
      const headlineBlock = document.getElementById('headlineBlock');
      const layerBack = document.getElementById('layerBack');
      const layerMid = document.getElementById('layerMid');
      const layerFront = document.getElementById('layerFront');
      const topShade = document.getElementById('topShade');
      const rainVideoA = document.getElementById('rainVideoA');
      const rainVideoB = document.getElementById('rainVideoB');

      // Asset references for readiness
      const imgDoors = new Image();
      imgDoors.src = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261117_063048_97fd9a70-adbe-46bd-bfce-ec1004f6c7d8.png&w=2000&q=85';
      const imgAerial = document.getElementById('imgAerial');
      const imgBack = document.getElementById('imgBack');
      const imgMid = document.getElementById('imgMid');
      const imgFront = document.getElementById('imgFront');

      let stageWidth = 1600;
      let stageHeight = 900;
      let wordSize = 290;
      let baselineY = 387;

      /* =======================================================================
         1. Dynamic Stage Sizing & Typography Calculation
         ======================================================================= */
      function initStageLayout() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        // Stage: larger of viewport width and viewport height * 16/9
        stageWidth = Math.max(vw, vh * 16 / 9);
        stageHeight = stageWidth * 9 / 16;

        stage.style.width = stageWidth + 'px';
        stage.style.height = stageHeight + 'px';

        // Update u variable
        let u = 1;
        if (vw >= 820 && vh > 500) {
          u = Math.min(vw / 1440, vh / 900);
        }
        document.documentElement.style.setProperty('--u', u + 'px');

        // Measure word at 100px font size
        const measureSpan = document.createElement('span');
        measureSpan.style.fontFamily = 'Inter, sans-serif';
        measureSpan.style.fontSize = '100px';
        measureSpan.style.fontWeight = '700';
        measureSpan.style.letterSpacing = '-0.045em';
        measureSpan.style.position = 'absolute';
        measureSpan.style.visibility = 'hidden';
        measureSpan.style.whiteSpace = 'nowrap';
        measureSpan.textContent = 'Summit';
        document.body.appendChild(measureSpan);
        const measuredWidthAt100 = measureSpan.getBoundingClientRect().width;
        document.body.removeChild(measureSpan);

        const widthPerEm = measuredWidthAt100 / 100;

        // Portrait check (height > 1.2 * width)
        const isPortrait = vh > 1.2 * vw;
        const baselinePercent = isPortrait ? 0.362 : 0.43;
        baselineY = stageHeight * baselinePercent;

        // Stage top in viewport
        const stageTopInViewport = (vh - stageHeight) / 2;
        const baselineInViewport = stageTopInViewport + baselineY;

        // Nav bottom in viewport
        let navBottom = 100 * u;
        if (vw < 820) {
          navBottom = 16 + 40 + 12 + 36; // approximate two rows
        } else if (vh <= 500) {
          navBottom = 12 + 34;
        }

        const sizeA = (0.625 * stageWidth) / widthPerEm;
        const sizeB = (0.92 * vw) / widthPerEm;
        const availableGap = baselineInViewport - (navBottom + 0.035 * vh);
        const sizeC = Math.max(20, availableGap / 0.88);

        wordSize = Math.min(sizeA, sizeB, sizeC);

        // Apply font size and positioning
        const giantWord = document.getElementById('giantWord');
        giantWord.style.fontSize = wordSize + 'px';

        // Position headline block so baseline rests at baselineY
        // Cap height for Inter is approx 0.727em. Baseline from top is approx fontSize * 0.73.
        const wordCapHeight = 0.727 * wordSize;
        headlineBlock.style.top = (baselineY - wordCapHeight) + 'px';

        // Kicker sizing and placement
        const kickerFontSize = 0.118 * wordSize;
        kicker.style.fontSize = kickerFontSize + 'px';
        kicker.style.top = (-kickerFontSize - 0.02 * wordSize) + 'px';
        kicker.style.transform = `translateX(-50%) translateX(-${0.1 * wordSize}px)`;
      }

      initStageLayout();
      window.addEventListener('resize', initStageLayout);

      /* =======================================================================
         2. Web Animations Master Clock Timeline (7.4s / 7400ms)
         ======================================================================= */
      const TOTAL_MS = 7400;
      const animations = [];

      // Easing helpers
      const easeDoorsLeft = 'cubic-bezier(.1,.2,.8,1)';
      const easeDoorsRight = 'cubic-bezier(.4,.6,.9,1)';
      const easeInOut = 'ease-in-out';
      const easeOut = 'ease-out';
      const easeHandoff = 'cubic-bezier(.45,0,.55,1)';
      const easeReveal = 'cubic-bezier(.2,.65,.3,1)';
      const easeBack = 'cubic-bezier(.45,0,.35,1)';
      const easeMidUp = 'cubic-bezier(.45,0,.3,1)';
      const easeHeadline = 'cubic-bezier(.3,0,.4,1)';
      const easeFrontUp = 'cubic-bezier(.2,.5,.2,1)';

      function createAnimation(el, keyframes) {
        if (!el) return null;
        const anim = el.animate(keyframes, {
          duration: TOTAL_MS,
          fill: 'both'
        });
        anim.pause();
        animations.push(anim);
        return anim;
      }

      // Left Door: 0.02s -> 1.13s (offset: 20/7400 -> 1130/7400)
      createAnimation(doorLeft, [
        { offset: 0, transform: 'translateX(0)' },
        { offset: 20 / 7400, transform: 'translateX(0)', easing: easeDoorsLeft },
        { offset: 1130 / 7400, transform: 'translateX(-101%)' },
        { offset: 1, transform: 'translateX(-101%)' }
      ]);

      // Right Door: 0.02s -> 1.24s (offset: 20/7400 -> 1240/7400)
      createAnimation(doorRight, [
        { offset: 0, transform: 'translateX(0)' },
        { offset: 20 / 7400, transform: 'translateX(0)', easing: easeDoorsRight },
        { offset: 1240 / 7400, transform: 'translateX(101%)' },
        { offset: 1, transform: 'translateX(101%)' }
      ]);

      // Tilt video opacity: 1.19s -> 1.47s (1190/7400 -> 1470/7400)
      createAnimation(tiltVideo, [
        { offset: 0, opacity: 0 },
        { offset: 1190 / 7400, opacity: 0, easing: easeInOut },
        { offset: 1470 / 7400, opacity: 1 },
        { offset: 1, opacity: 1 }
      ]);

      // Opening box: 2.45s -> 2.95s (2450/7400 -> 2950/7400)
      createAnimation(openingBox, [
        { offset: 0, opacity: 1 },
        { offset: 2450 / 7400, opacity: 1, easing: easeHandoff },
        { offset: 2950 / 7400, opacity: 0 },
        { offset: 1, opacity: 0 }
      ]);

      // Nav: 2.45s -> 2.75s (2450/7400 -> 2750/7400)
      createAnimation(nav, [
        { offset: 0, opacity: 0, transform: 'translateY(-6px)' },
        { offset: 2450 / 7400, opacity: 0, transform: 'translateY(-6px)', easing: easeOut },
        { offset: 2750 / 7400, opacity: 1, transform: 'translateY(0)' },
        { offset: 1, opacity: 1, transform: 'translateY(0)' }
      ]);

      // Kicker: 2.45s -> 3.10s (2450/7400 -> 3100/7400)
      createAnimation(kicker, [
        { offset: 0, opacity: 0, transform: 'translate(0, 0.5em)' },
        { offset: 2450 / 7400, opacity: 0, transform: 'translate(0, 0.5em)', easing: easeReveal },
        { offset: 3100 / 7400, opacity: 1, transform: 'translate(0, 0)' },
        { offset: 1, opacity: 1, transform: 'translate(0, 0)' }
      ]);

      // Letters reveal: 2.45 + i * 0.054 -> + 0.70s
      letters.forEach((letter, i) => {
        const startSec = 2.45 + i * 0.054;
        const endSec = startSec + 0.70;
        createAnimation(letter, [
          { offset: 0, opacity: 0, transform: 'translateY(0.14em)' },
          { offset: (startSec * 1000) / TOTAL_MS, opacity: 0, transform: 'translateY(0.14em)', easing: easeReveal },
          { offset: (endSec * 1000) / TOTAL_MS, opacity: 1, transform: 'translateY(0)' },
          { offset: 1, opacity: 1, transform: 'translateY(0)' }
        ]);
      });

      // Top shade: 2.90s -> 3.70s (2900/7400 -> 3700/7400)
      createAnimation(topShade, [
        { offset: 0, opacity: 0 },
        { offset: 2900 / 7400, opacity: 0, easing: easeInOut },
        { offset: 3700 / 7400, opacity: 1 },
        { offset: 1, opacity: 1 }
      ]);

      // Back layer: 2.90s -> 4.30s (2900/7400 -> 4300/7400)
      createAnimation(layerBack, [
        { offset: 0, transform: 'translateY(0)' },
        { offset: 2900 / 7400, transform: 'translateY(0)', easing: easeBack },
        { offset: 4300 / 7400, transform: 'translateY(-1.5%)' },
        { offset: 1, transform: 'translateY(-1.5%)' }
      ]);

      // Mid layer: 2.90s -> 4.30s (-4%), hold to 4.60s, -> 6.90s (0)
      createAnimation(layerMid, [
        { offset: 0, transform: 'translateY(0)' },
        { offset: 2900 / 7400, transform: 'translateY(0)', easing: easeMidUp },
        { offset: 4300 / 7400, transform: 'translateY(-4%)' },
        { offset: 4600 / 7400, transform: 'translateY(-4%)', easing: easeHandoff },
        { offset: 6900 / 7400, transform: 'translateY(0)' },
        { offset: 1, transform: 'translateY(0)' }
      ]);

      // Headline block: 3.00s -> 4.80s (3000/7400 -> 4800/7400)
      createAnimation(headlineBlock, [
        { offset: 0, transform: 'translateX(-50%) translateY(6%)' },
        { offset: 3000 / 7400, transform: 'translateX(-50%) translateY(6%)', easing: easeHeadline },
        { offset: 4800 / 7400, transform: 'translateX(-50%) translateY(0)' },
        { offset: 1, transform: 'translateX(-50%) translateY(0)' }
      ]);

      // Front layer: 3.35s -> 6.00s (-2.5%) -> 7.30s (0)
      createAnimation(layerFront, [
        { offset: 0, transform: 'translateY(66%)' },
        { offset: 3350 / 7400, transform: 'translateY(66%)', easing: easeFrontUp },
        { offset: 6000 / 7400, transform: 'translateY(-2.5%)', easing: easeHandoff },
        { offset: 7300 / 7400, transform: 'translateY(0)' },
        { offset: 1, transform: 'translateY(0)' }
      ]);

      /* =======================================================================
         3. Rain Loop Controller (Back Layer)
         ======================================================================= */
      let rainStarted = false;
      let activeRainVideo = null;
      const RAIN_CLIP_LOOP_END = 3.6;
      const RAIN_CROSSFADE_LEAD = 0.75; // trigger crossfade at 3.6 - 0.75 = 2.85s

      function startRainLoop() {
        if (rainStarted) return;
        rainStarted = true;
        activeRainVideo = rainVideoA;
        rainVideoA.currentTime = 0;
        rainVideoA.style.opacity = '1';
        rainVideoA.play().catch(() => {});

        setupRainCrossfade(rainVideoA, rainVideoB);
        setupRainCrossfade(rainVideoB, rainVideoA);
      }

      function setupRainCrossfade(currentVid, nextVid) {
        currentVid.addEventListener('timeupdate', function () {
          if (activeRainVideo === currentVid && currentVid.currentTime >= (RAIN_CLIP_LOOP_END - RAIN_CROSSFADE_LEAD)) {
            nextVid.currentTime = 0;
            nextVid.style.opacity = '1';
            nextVid.play().catch(() => {});

            currentVid.style.opacity = '0';
            activeRainVideo = nextVid;

            setTimeout(() => {
              if (activeRainVideo !== currentVid) {
                currentVid.pause();
              }
            }, 800);
          }
        });
      }

      /* =======================================================================
         4. Master Clock Loop & Tilt Video Sync (1.25s -> 2.85s)
         ======================================================================= */
      let clockStartTime = null;
      let isIntroFinished = false;

      function masterTick(now) {
        if (!clockStartTime) clockStartTime = now;
        const elapsedSec = (now - clockStartTime) / 1000;
        const elapsedMs = now - clockStartTime;

        // Update all paused animations
        const boundedMs = Math.min(elapsedMs, TOTAL_MS);
        for (let i = 0; i < animations.length; i++) {
          animations[i].currentTime = boundedMs;
        }

        // Tilt Video Playback Sync (1.25s -> 2.85s)
        if (elapsedSec >= 1.25 && elapsedSec < 2.85) {
          const windowProgress = (elapsedSec - 1.25) / 1.6;
          const targetVideoTime = windowProgress * 5.04;

          if (tiltVideo.paused) {
            tiltVideo.play().catch(() => {});
          }

          const baseRate = 5.04 / 1.6; // ~3.15
          const timeDiff = targetVideoTime - tiltVideo.currentTime;
          const nudgedRate = baseRate + (timeDiff * 1.5);
          tiltVideo.playbackRate = Math.max(0.85 * baseRate, Math.min(1.2 * baseRate, nudgedRate));
        } else if (elapsedSec >= 2.85 && elapsedSec < 3.2) {
          if (!tiltVideo.paused) {
            tiltVideo.pause();
            tiltVideo.currentTime = 5.04;
          }
        }

        // Start rain loop at 2.40s
        if (elapsedSec >= 2.40 && !rainStarted) {
          startRainLoop();
        }

        // Finish intro at 7.4s
        if (elapsedMs >= TOTAL_MS && !isIntroFinished) {
          isIntroFinished = true;
          document.body.classList.remove('intro');
          if (doorsBox) doorsBox.style.display = 'none';
          if (openingBox) openingBox.style.display = 'none';
          return;
        }

        if (!isIntroFinished) {
          requestAnimationFrame(masterTick);
        }
      }

      /* =======================================================================
         5. Preload & Asset Readiness Check
         ======================================================================= */
      let isReadyToStart = false;

      function checkAssetsReady() {
        if (isReadyToStart) return;

        const doorsReady = imgDoors.complete && imgDoors.naturalWidth > 0;
        const aerialReady = imgAerial.complete && imgAerial.naturalWidth > 0;
        const backReady = imgBack.complete && imgBack.naturalWidth > 0;
        const midReady = imgMid.complete && imgMid.naturalWidth > 0;
        const frontReady = imgFront.complete && imgFront.naturalWidth > 0;
        const tiltReady = tiltVideo.readyState >= 3; // HAVE_FUTURE_DATA or HAVE_ENOUGH_DATA

        if (doorsReady && aerialReady && backReady && midReady && frontReady && tiltReady) {
          isReadyToStart = true;
          // 120ms pause before starting
          setTimeout(() => {
            requestAnimationFrame(masterTick);
          }, 120);
        }
      }

      imgDoors.onload = checkAssetsReady;
      imgAerial.onload = checkAssetsReady;
      imgBack.onload = checkAssetsReady;
      imgMid.onload = checkAssetsReady;
      imgFront.onload = checkAssetsReady;
      tiltVideo.addEventListener('canplaythrough', checkAssetsReady);

      // Failsafe starts at 5s regardless
      setTimeout(() => {
        if (!isReadyToStart) {
          console.warn('[Harborlux] Failsafe timer triggered at 5.0s');
          isReadyToStart = true;
          requestAnimationFrame(masterTick);
        }
      }, 5000);

    })();
  </script>
